services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "8000:4000"
    env_file:
      - .env
    environment:
      - ENV_RELOAD_INTERVAL=300 # check for env file changes every 5 minutes
      - ENV_RELOAD_COOLDOWN=30 # min seconds between reloads to avoid rapid loops
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs # persist logs locally
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ~/.env.aws:/app/env.aws:ro
    entrypoint: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
