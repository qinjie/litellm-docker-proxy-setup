model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-5
      aws_region_name: us-west-2
  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-west-2
  - model_name: claude-opus-5-5
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-5-5
      aws_region_name: us-west-2
  # Bedrock serves Fable only when the us-west-2 data-retention mode is aws_review (or
  # the legacy provider_data_share): AWS retains prompts and outputs and may review
  # them, without sharing them with Anthropic. Under inherit, every call here fails
  # with a 400 "data retention mode 'default' is not available for this model".
  - model_name: claude-fable-5-1
    litellm_params:
      model: bedrock/global.anthropic.claude-fable-5-1
      aws_region_name: us-west-2
  # converse/ is explicit on gpt-6-sol and gpt-6-luna because litellm picks the Bedrock
  # route from its bedrock_converse_models list, and the current image lists neither;
  # without the prefix they go to the invoke route. The other two are in that list.
  - model_name: gpt-6-sol
    litellm_params:
      model: bedrock/converse/global.openai.gpt-6-sol
      aws_region_name: us-west-2
  - model_name: gpt-6-luna
    litellm_params:
      model: bedrock/converse/global.openai.gpt-6-luna
      aws_region_name: us-west-2
  - model_name: gpt-6-astra
    litellm_params:
      model: bedrock/global.openai.gpt-6-astra
      aws_region_name: us-west-2
  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock/global.openai.gpt-5.6-terra
      aws_region_name: us-west-2
  - model_name: global.cohere.embed-v4:0
    litellm_params:
      model: bedrock/global.cohere.embed-v4:0
      aws_region_name: us-west-2

litellm_settings: # module level litellm settings - https://github.com/BerriAI/litellm/blob/main/litellm/__init__.py
  # Uncomment and configure if you need MCP semantic tool filtering
  # mcp_semantic_tool_filter:
  #   enabled: true
  #   embedding_model: "cohere.embed-multilingual-v3"
  #   top_k: 5
  #   similarity_threshold: 0.3

  # Re-read the AWS credentials file when AWS rejects the credentials in use,
  # instead of waiting out the scheduled re-read. See scripts/aws_credential_refresh.py.
  # No model entry may set an aws_* credential param: that switches litellm to an
  # uncached code path, which removes both the schedule and anything for this callback
  # to invalidate.
  callbacks: ["aws_credential_refresh.aws_credential_refresh_instance"]

  drop_params: true
  cache: true
  cache_params:
    type: local # in-memory cache (no extra deps required)
    ttl: 3600
    default_max_size: 1000 # max number of cached items

  max_budget: 500 # (float) sets max budget as $0 USD
  budget_duration: 1mo # (str) frequency of reset - You can set duration as seconds ("30s"), minutes ("30m"), hours ("30h"), days ("30d").
  max_internal_user_budget: 500 # amount in USD for a month for a user
  internal_user_budget_duration: "1mo" # reset every month
  # Local JSON file logging
  success_callback: ["json"]
  failure_callback: ["json"]
  json_logs:
    log_file_path: /app/logs/litellm.log

general_settings:
  master_key: # [OPTIONAL] Only use this if you to require all calls to contain this key (Authorization: Bearer sk-1234)
  # [Optional] The `db` is refer to the name of the database service in docker-compose.yml
